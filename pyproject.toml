[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "metatron"
version = "0.1.0"
description = "METATRON: one end-to-end seller-recruitment flow with CrewAI"
requires-python = ">=3.12"
dependencies = [
    "crewai[anthropic]>=1.15",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "pyarrow>=15",
    "pyyaml>=6",
    "jsonschema>=4.21",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "streamlit>=1.38",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
nadlan-pro = ["firebase-admin>=6.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
